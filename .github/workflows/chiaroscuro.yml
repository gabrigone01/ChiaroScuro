# Costruisce l'app Chiaroscuro per macOS (Apple Silicon), Windows e Linux.
# - A mano (Actions > Chiaroscuro app > Run workflow): i pacchetti sono negli "Artifacts" dell'esecuzione.
# - Con un tag "chiaroscuro-v1.2.3": crea anche la Release con i pacchetti allegati, sia con la versione nel nome
#   sia con un nome fisso (es. Chiaroscuro-macOS-arm64.dmg) usato dai link "ultima versione" del README.
name: Chiaroscuro app
on:
  workflow_dispatch: {}
  push:
    tags: ["chiaroscuro-v*"]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Tk (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk tk
      - name: Inno Setup (Windows)
        if: runner.os == 'Windows'
        run: choco install innosetup -y --no-progress
      - name: Verifica dell'analisi
        run: python Chiaroscuro/scripts/simula_piano.py --offline --seed 3
      - name: Build
        run: python Chiaroscuro/app/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: Chiaroscuro-${{ matrix.os }}
          path: Chiaroscuro/release/*

  release:
    needs: build
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/chiaroscuro-v') }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Nomi fissi per i link "ultima versione"
        run: |
          mkdir -p out
          for f in dist/*/*; do
            cp "$f" out/
            cp "$f" "out/$(basename "$f" | sed -E 's/-[0-9]+\.[0-9]+\.[0-9]+//')"
          done
          ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          name: Chiaroscuro ${{ github.ref_name }}
          files: out/*
          body: |
            Luci che seguono il pianoforte. Richiede **QLC+ 4** (www.qlcplus.org).
            - **macOS** (Apple Silicon): `.dmg` → trascina Chiaroscuro in Applicazioni; la prima volta clic destro → Apri.
            - **Windows**: `Setup.exe` (o lo `.zip` portatile).
            - **Linux**: estrai il `.tar.gz` ed esegui `./install.sh`.
