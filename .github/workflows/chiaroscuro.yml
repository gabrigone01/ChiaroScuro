# Costruisce l'app Chiaroscuro per macOS (Apple Silicon e Intel), Windows e Linux.
# Avvio: a mano da GitHub (Actions > Chiaroscuro app > Run workflow) oppure con un tag "chiaroscuro-v1.0.0".
# I file pronti (dmg, Setup.exe, zip, tar.gz) sono negli "Artifacts" dell'esecuzione.
name: Chiaroscuro app
on:
  workflow_dispatch: {}
  push:
    tags: ["chiaroscuro-v*"]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-13, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Tk (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk tk
      - name: Inno Setup (Windows)
        if: runner.os == 'Windows'
        run: choco install innosetup -y --no-progress
      - name: Verifica dell'analisi
        run: python Chiaroscuro/scripts/simula_piano.py --offline --seed 3
      - name: Build
        run: python Chiaroscuro/app/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: Chiaroscuro-${{ matrix.os }}
          path: Chiaroscuro/release/*
